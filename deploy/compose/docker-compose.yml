# Full single-host install: PostgreSQL, ClickHouse and monitor-server (which
# also serves the web UI). Copy .env.example to .env and edit before use.
#
#   cd deploy/compose
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec server /monitor-server user create \
#       --email you@example.com --name "You" --org "Your Org" --password-stdin
#
name: monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: monitor
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: monitor-server:local
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      MONITOR_LISTEN_ADDR: ":8080"
      MONITOR_POSTGRES_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
      MONITOR_CLICKHOUSE_URL: clickhouse://monitor:${CLICKHOUSE_PASSWORD}@clickhouse:9000/monitor
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-http://localhost:8080}
      MONITOR_LOG_LEVEL: ${MONITOR_LOG_LEVEL:-info}
    ports:
      - "${MONITOR_PORT:-8080}:8080"

volumes:
  postgres-data:
  clickhouse-data:
