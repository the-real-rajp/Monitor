name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: monitor_test
          CLICKHOUSE_USER: monitor
          CLICKHOUSE_PASSWORD: monitor
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["9000:9000", "8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping | grep -q Ok"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check generated sqlc code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
          sqlc generate -f internal/store/pg/sqlc.yaml
          git diff --exit-code -- internal/store/pg/sqlc
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1
      - name: Unit and integration tests
        env:
          MONITOR_TEST_PG_URL: postgres://monitor:monitor@localhost:5432/monitor_test?sslmode=disable
          MONITOR_TEST_CH_URL: clickhouse://monitor:monitor@localhost:9000/monitor_test
        run: go test -race -count=1 -tags integration ./...
      - name: Build all binaries
        run: |
          go build ./cmd/server ./cmd/prober ./cmd/agent

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Check generated OpenAPI types are current
        run: |
          npm run openapi
          git diff --exit-code -- src/api/schema.d.ts
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  image:
    name: Server image builds
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: monitor-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
